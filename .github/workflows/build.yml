name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unzip and build
        run: |
          unzip -o ./*.zip -d proj
          D=$(dirname "$(find proj -name settings.gradle | head -1)")
          cd "$D" && gradle assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk
